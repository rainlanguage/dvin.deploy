[profile.default]
# See more config options https://github.com/foundry-rs/foundry/tree/master/config
solc = "0.8.25"
optimizer = true
optimizer_runs = 100000
evm_version = "cancun"
bytecode_hash = "none"
cbor_metadata = false
libs = ["dependencies"]
remappings = [
    "@openzeppelin/contracts/=dependencies/@openzeppelin-contracts-5.6.1/",
    "@openzeppelin/contracts-upgradeable/=dependencies/@openzeppelin-contracts-upgradeable-5.6.1/",
]

[dependencies]
forge-std = "1.16.1"
"@openzeppelin-contracts" = "5.6.1"
"@openzeppelin-contracts-upgradeable" = "5.6.1"
solady = "0.1.26"
rain-vats = "0.1.6"
rain-extrospection = "0.1.1"
rain-factory = "0.1.1"
rain-flare = "0.1.2"
rain-math-fixedpoint = "0.2.0"
rain-math-float = "0.1.1"
rain-string = "0.2.0"
rain-verify-interface = "0.1.0"
rainlang = "0.1.2"
rain-interpreter-interface = "0.1.0"
rain-metadata = "0.1.0"
rain-sol-codegen = "0.1.0"
rain-lib-typecast = "0.1.0"
rain-deploy = "0.1.2"
rain-intorastring = "0.1.0"
rain-lib-hash = "0.1.0"
rain-lib-memkv = "0.1.0"
rain-math-binary = "0.1.1"
rain-solmem = "0.1.3"
rain-tofu-erc20-decimals = "0.1.1"

[soldeer]
recursive_deps = false
